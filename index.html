<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>CarPlay</title>

  <!-- PWA / iOS Vollbild -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CarPlay" />
  <link rel="apple-touch-icon" href="icons/app-icon-180.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app wp-aurora">
    <!-- Linke Dock-Leiste mit Status oben (wie CarPlay) -->
    <nav id="dock" class="dock" aria-label="Dock">
      <div class="dock-status">
        <span id="clock" class="clock">--:--</span>
        <span class="dock-signal">
          <svg class="sig-bars" viewBox="0 0 22 14" width="20" height="13" aria-hidden="true">
            <rect x="0"  y="9" width="3.2" height="5"  rx="1"/>
            <rect x="5"  y="6" width="3.2" height="8"  rx="1"/>
            <rect x="10" y="3" width="3.2" height="11" rx="1"/>
            <rect x="15" y="0" width="3.2" height="14" rx="1" opacity=".35"/>
          </svg>
          <svg class="sig-wifi" viewBox="0 0 20 15" width="18" height="13" aria-hidden="true">
            <path d="M10 13.6a1.5 1.5 0 1 0 .01 0zM3.3 7.1a9.4 9.4 0 0 1 13.4 0l-1.7 1.7a7 7 0 0 0-10 0zM6.2 10a5.3 5.3 0 0 1 7.6 0l-1.7 1.7a2.9 2.9 0 0 0-4.2 0z"/>
          </svg>
        </span>
      </div>
      <div id="dock-apps" class="dock-apps"></div>
      <div class="dock-spacer"></div>
      <button id="dock-home" class="dock-home" title="Home" aria-label="Home"></button>
    </nav>

    <!-- aktiver Screen -->
    <main id="screen-root" class="screen-root" aria-live="polite"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
