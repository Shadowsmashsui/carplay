<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>CarPlay</title>

  <!-- PWA / iOS Vollbild -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CarPlay" />
  <link rel="apple-touch-icon" href="icons/app-icon-180.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Linke Dock-Leiste -->
    <nav id="dock" class="dock" aria-label="Dock"></nav>

    <!-- Rechter Bereich: Statusleiste + aktiver Screen -->
    <div class="stage">
      <header id="statusbar" class="statusbar">
        <div class="status-left"><span id="clock" class="clock">--:--</span></div>
        <div class="status-right">
          <span class="status-ico" title="Signal">
            <svg viewBox="0 0 24 16" width="22" height="15"><rect x="0" y="10" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="9" rx="1"/><rect x="10" y="4" width="3" height="12" rx="1"/><rect x="15" y="1" width="3" height="15" rx="1"/></svg>
          </span>
          <span class="status-ico" title="WLAN">
            <svg viewBox="0 0 24 18" width="22" height="16"><path d="M12 15.5a1.6 1.6 0 1 0 0 .01zM4.2 8.4a11 11 0 0 1 15.6 0l-1.8 1.8a8.4 8.4 0 0 0-12 0zM7.6 11.8a6.2 6.2 0 0 1 8.8 0l-1.8 1.8a3.6 3.6 0 0 0-5.2 0z"/></svg>
          </span>
        </div>
      </header>

      <main id="screen-root" class="screen-root" aria-live="polite"></main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
